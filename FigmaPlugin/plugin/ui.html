<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background: #F8F7F6;
      color: #1F1A1B;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    
    h2 {
      font-size: 15px;
      margin: 0 0 14px 0;
      font-weight: 700;
      color: #7A1C2E;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .refresh-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #B88E96;
      font-size: 18px;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }

    .refresh-btn:hover {
      color: #7A1C2E;
      background: #FCEEF0;
    }

    .active-info {
      font-size: 11px;
      background: #FCEEF0;
      color: #7A1C2E;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px dashed #EAD5D8;
      font-weight: 500;
      display: none;
    }

    .scripts-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .script-item {
      background: white;
      border: 1px solid #EAD5D8;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
    }

    .script-item.active {
      border-color: #7A1C2E;
      background: #FFFDFD;
    }

    .script-item:hover {
      border-color: #7A1C2E;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(122, 28, 46, 0.05);
    }

    .script-name {
      font-size: 12px;
      font-weight: 600;
      color: #332A2B;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .status-badge {
      font-size: 10px;
      color: #27AE60;
      font-weight: bold;
      display: none;
    }

    .script-item.active .status-badge {
      display: inline;
    }

    .run-btn {
      background: #7A1C2E;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .run-btn:hover {
      background: #5A111F;
    }

    .script-item.active .run-btn {
      background: #EAD5D8;
      color: #7A1C2E;
    }

    .footer {
      font-size: 9px;
      color: #A39295;
      text-align: center;
      margin-top: auto;
      border-top: 1px solid #EAD5D8;
      padding-top: 10px;
    }

    .empty-state {
      font-size: 12px;
      color: #A39295;
      text-align: center;
      padding: 36px 10px;
    }
  </style>
</head>
<body>
  <h2>
    <span>Figma Script Runner</span>
    <button class="refresh-btn" id="refresh" title="Refresh scripts list">↻</button>
  </h2>
  
  <div class="active-info" id="activeInfo">
    🔥 Auto-running active: <strong id="activeScriptName">None</strong>
  </div>

  <div class="scripts-list" id="list">
    <div class="empty-state">Connecting to server...</div>
  </div>

  <div class="footer">
    Connected to Local Dev Server (Port 3003)
  </div>

  <script>
    const serverUrl = 'http://localhost:3003';
    const listEl = document.getElementById('list');
    const activeInfo = document.getElementById('activeInfo');
    const activeScriptName = document.getElementById('activeScriptName');
    let activeScript = null;

    async function loadScripts() {
      try {
        const response = await fetch(`${serverUrl}/api/scripts`);
        const data = await response.json();
        
        if (!data.scripts || data.scripts.length === 0) {
          listEl.innerHTML = '<div class="empty-state">No .js scripts found in figma-hot-reload/scripts/</div>';
          return;
        }

        listEl.innerHTML = '';
        data.scripts.forEach(script => {
          const item = document.createElement('div');
          item.className = 'script-item';
          if (activeScript === script) {
            item.classList.add('active');
          }
          
          const nameSpan = document.createElement('span');
          nameSpan.className = 'script-name';
          nameSpan.textContent = script;
          
          const statusSpan = document.createElement('span');
          statusSpan.className = 'status-badge';
          statusSpan.textContent = '● Watching ';

          const button = document.createElement('button');
          button.className = 'run-btn';
          button.textContent = activeScript === script ? 'Run Again' : 'Watch & Run';
          
          button.onclick = (e) => {
            e.stopPropagation();
            selectScript(script);
          };

          item.onclick = () => {
            selectScript(script);
          };

          const rightContainer = document.createElement('div');
          rightContainer.style.display = 'flex';
          rightContainer.style.alignItems = 'center';
          rightContainer.style.gap = '8px';
          rightContainer.appendChild(statusSpan);
          rightContainer.appendChild(button);

          item.appendChild(nameSpan);
          item.appendChild(rightContainer);
          listEl.appendChild(item);
        });
      } catch (err) {
        listEl.innerHTML = `
          <div class="empty-state" style="color: #7A1C2E; font-weight: 600;">
            Offline
            <div style="font-weight: 400; font-size: 11px; margin-top: 6px; color: #A39295;">
              Start the Node server from your terminal:
              <br><code style="background: #FCEEF0; padding: 2px 4px; border-radius: 4px; display: inline-block; margin-top: 4px;">node server.js</code>
            </div>
          </div>`;
      }
    }

    function selectScript(scriptName) {
      activeScript = scriptName;
      activeScriptName.textContent = scriptName;
      activeInfo.style.display = 'block';
      
      // Update UI list state
      document.querySelectorAll('.script-item').forEach(el => {
        const isCurrent = el.querySelector('.script-name').textContent === scriptName;
        el.classList.toggle('active', isCurrent);
        el.querySelector('.run-btn').textContent = isCurrent ? 'Run Again' : 'Watch & Run';
      });

      // Trigger first execution
      parent.postMessage({ pluginMessage: { type: 'run-script', scriptName } }, '*');
    }

    // Connect Server-Sent Events (SSE) for live reload triggers
    function setupSSE() {
      const eventSource = new EventSource(`${serverUrl}/api/watch`);
      
      eventSource.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.event === 'change' && activeScript === data.filename) {
          console.log(`File change detected: ${data.filename}. Auto-running...`);
          parent.postMessage({ pluginMessage: { type: 'run-script', scriptName: activeScript } }, '*');
        }
      };

      eventSource.onerror = () => {
        eventSource.close();
        setTimeout(setupSSE, 2000); // Attempt to reconnect
      };
    }

    document.getElementById('refresh').addEventListener('click', loadScripts);

    // Initial load
    loadScripts();
    setupSSE();

    // Listen to messages from code.js
    window.onmessage = async (event) => {
      const msg = event.data.pluginMessage;
      if (msg && msg.type === 'fetch-and-eval') {
        try {
          const res = await fetch(`${serverUrl}/api/scripts/${encodeURIComponent(msg.scriptName)}`);
          const code = await res.text();
          parent.postMessage({ pluginMessage: { type: 'eval-code', scriptName: msg.scriptName, code } }, '*');
        } catch (e) {
          console.error("Error fetching code:", e);
        }
      }
    };
  </script>
</body>
</html>
