<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --border: #334155;
      --primary: #6366F1;
      --primary-hover: #4F46E5;
      --accent: #10B981;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --danger: #EF4444;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 600;
    }

    .badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .status-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .active-script-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      word-break: break-all;
    }

    .log-box {
      flex: 1;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-family: 'Fira Code', monospace, monospace;
      font-size: 11px;
      color: var(--text-muted);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .log-item {
      line-height: 1.4;
    }
    .log-item.success { color: #34D399; }
    .log-item.error { color: #F87171; }
    .log-item.info { color: #818CF8; }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .footer {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>🎨 Figma AI Generator</span>
    </div>
    <div id="connectionBadge" class="badge offline">
      <span class="dot"></span>
      <span id="connectionText">Connecting...</span>
    </div>
  </div>

  <div class="status-card">
    <div class="status-title">Active Sync Status</div>
    <div class="active-script-name" id="activeStatus">Waiting for prompts from Web Platform...</div>
  </div>

  <div class="log-box" id="logBox">
    <div class="log-item info">⚡ Listener ready. Open Web Platform at http://localhost:3003</div>
  </div>

  <button class="btn" id="runLatestBtn">Execute Latest Script</button>

  <div class="footer">
    Connected to Local Dev Server (Port 3003)
  </div>

  <script>
    const serverUrl = 'http://localhost:3003';
    const connectionBadge = document.getElementById('connectionBadge');
    const connectionText = document.getElementById('connectionText');
    const activeStatus = document.getElementById('activeStatus');
    const logBox = document.getElementById('logBox');
    const runLatestBtn = document.getElementById('runLatestBtn');
    
    let lastScriptName = 'latest_generated.js';

    function addLog(msg, type = 'info') {
      const item = document.createElement('div');
      item.className = `log-item ${type}`;
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      item.textContent = `[${time}] ${msg}`;
      logBox.appendChild(item);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setConnected(isConnected) {
      if (isConnected) {
        connectionBadge.className = 'badge';
        connectionText.textContent = 'Connected';
      } else {
        connectionBadge.className = 'badge offline';
        connectionText.textContent = 'Disconnected';
      }
    }

    // Connect Server-Sent Events (SSE) for automatic triggers
    function setupSSE() {
      const eventSource = new EventSource(`${serverUrl}/api/watch`);
      
      eventSource.onopen = () => {
        setConnected(true);
        addLog('Connected to Web Platform bridge', 'success');
      };

      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.event === 'change' || data.event === 'run-generated') {
            const filename = data.filename || 'latest_generated.js';
            lastScriptName = filename;
            activeStatus.textContent = `⚡ Received update: ${filename}`;
            addLog(`Executing generated script: ${filename}`, 'info');
            
            // Request code fetch and evaluation
            parent.postMessage({ pluginMessage: { type: 'run-script', scriptName: filename } }, '*');
          }
        } catch (e) {
          console.error("SSE parse error", e);
        }
      };

      eventSource.onerror = () => {
        setConnected(false);
        eventSource.close();
        setTimeout(setupSSE, 3000); // Reconnect loop
      };
    }

    runLatestBtn.addEventListener('click', () => {
      addLog(`Manually re-running ${lastScriptName}...`, 'info');
      parent.postMessage({ pluginMessage: { type: 'run-script', scriptName: lastScriptName } }, '*');
    });

    // Listen to messages from code.js in main thread
    window.onmessage = async (event) => {
      const msg = event.data ? event.data.pluginMessage : null;
      if (!msg) return;

      if (msg.type === 'fetch-and-eval') {
        try {
          const res = await fetch(`${serverUrl}/api/scripts/${encodeURIComponent(msg.scriptName)}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const code = await res.text();
          parent.postMessage({ pluginMessage: { type: 'eval-code', scriptName: msg.scriptName, code } }, '*');
        } catch (e) {
          addLog(`Failed to fetch script: ${e.message}`, 'error');
        }
      } else if (msg.type === 'execution-status') {
        if (msg.status === 'success') {
          addLog(`✅ UI created successfully on Figma canvas!`, 'success');
          activeStatus.textContent = `✅ Ready for next prompt`;
        } else {
          addLog(`❌ Execution failed: ${msg.error}`, 'error');
          activeStatus.textContent = `❌ Execution Error`;
        }
      }
    };

    // Initialize
    setupSSE();
  </script>
</body>
</html>
